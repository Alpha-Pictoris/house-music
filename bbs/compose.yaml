services:
  bbs:
    build: .
    image: ssharg
    restart: unless-stopped
    ports:
      - "${SSHARG_PORT:-2222}:2222"
    volumes:
      - data:/data
      - ./world:/app/world:ro
      - type: bind
        source: ./user_ca.pub
        target: /ca/user_ca.pub
        read_only: true
        bind:
          # Fail with "no such file" instead of creating an empty directory.
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Issues player certificates. The CA private key stays on the host and is
  # only mounted for these one-off runs, never into the bbs container.
  cert:
    image: ssharg
    profiles: [tools]
    entrypoint: ["ssharg-cert"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /work
    volumes:
      - .:/work
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:
